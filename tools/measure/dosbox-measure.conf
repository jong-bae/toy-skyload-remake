# 블랙박스 측정용 DOSBox 설정: CPU 속도를 고정하고 녹화 폴더를 지정한다
[sdl]
fullscreen=false
windowresolution=original
output=surface
autolock=false

[dosbox]
machine=svga_s3
captures=D:\GitHub\skyload\recordings\capture

[render]
frameskip=0
aspect=false
scaler=none

[cpu]
core=normal
cputype=auto
cycles=fixed 20000

[mixer]
nosound=false
rate=22050

[sblaster]
sbtype=sb16

[autoexec]
mount c "D:\GitHub\skyload\recordings\game"
c:
SKYROADS.EXE
